apiVersion: apps/v1
kind: Deployment
metadata:
  name: wren-sidecar
  namespace: datart
  labels:
    app: wren-sidecar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wren-sidecar
  template:
    metadata:
      annotations:
        wren.ai/published-at: PUBLISHED_AT
      labels:
        app: wren-sidecar
    spec:
      nodeName: NODE_NAME
      containers:
        - name: wren-sidecar
          image: IMAGE
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: PROFILE
              value: test-ali
            - name: WREN_PORT
              value: "8090"
            - name: WREN_HOST
              value: 0.0.0.0
            - name: WREN_PROJECT
              value: /dianyi/app/wren-sidecar/project
            - name: HOSTIP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: project
              mountPath: /dianyi/app/wren-sidecar/project
            - name: docker-log
              mountPath: /docker/log
      volumes:
        - name: project
          hostPath:
            path: /data/wren-sidecar/project
            type: DirectoryOrCreate
        - name: docker-log
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: wren-sidecar
  namespace: datart
  labels:
    app: wren-sidecar
spec:
  type: NodePort
  selector:
    app: wren-sidecar
  ports:
    - name: http
      port: 8090
      targetPort: http
      nodePort: 30081
